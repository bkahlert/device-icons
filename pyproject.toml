[project]
name = "device-icons"
version = "0.3.0"
description = "Export the Finder icons and SF Symbols of Apple device types, and preview model identifiers in Finder"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Björn Kahlert" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
device-icons = "device_icons.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["macos: calls iconutil, osascript, dns-sd, or CoreUI; skipped off macOS"]

[tool.ruff]
line-length = 160
